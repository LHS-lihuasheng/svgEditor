<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#f5f5f7" />
  
  <!-- 顶部导航栏 -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" stroke="#e0e0e0" />
  <text x="30" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#333333">SVG编辑器</text>
  
  <!-- 占位Logo -->
  <image x="1100" y="15" width="30" height="30" href="/placeholder-logo.svg" />
  
  <!-- 左侧工具栏 -->
  <rect x="0" y="60" width="240" height="740" fill="#ffffff" stroke="#e0e0e0" />
  <text x="20" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">组件工具箱</text>
  
  <!-- 工具项 -->
  <g id="draggable-tool-1">
    <rect x="20" y="110" width="200" height="50" rx="5" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
    <text x="70" y="140" font-family="Arial" font-size="14" fill="#333333">基础矩形</text>
    <rect x="30" y="120" width="30" height="30" fill="#1890ff" />
  </g>
  
  <g id="draggable-tool-2">
    <rect x="20" y="170" width="200" height="50" rx="5" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
    <text x="70" y="200" font-family="Arial" font-size="14" fill="#333333">基础圆形</text>
    <circle cx="45" cy="195" r="15" fill="#1890ff" />
  </g>
  
  <g id="draggable-tool-3">
    <rect x="20" y="230" width="200" height="50" rx="5" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
    <text x="70" y="260" font-family="Arial" font-size="14" fill="#333333">文本元素</text>
    <text x="40" y="260" font-family="Arial" font-size="16" font-weight="bold" fill="#1890ff">T</text>
  </g>
  
  <g id="draggable-tool-4">
    <rect x="20" y="290" width="200" height="50" rx="5" fill="#e6f7ff" stroke="#1890ff" stroke-width="1" />
    <text x="70" y="320" font-family="Arial" font-size="14" fill="#333333">图片占位</text>
    <rect x="30" y="300" width="30" height="30" fill="#1890ff" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,2" />
  </g>
  
  <!-- 右侧组件树 -->
  <rect x="940" y="60" width="260" height="740" fill="#ffffff" stroke="#e0e0e0" />
  <text x="960" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#333333">组件层级树</text>
  
  <!-- 组件树节点 -->
  <rect x="960" y="110" width="220" height="30" rx="3" fill="#f0f0f0" />
  <text x="980" y="130" font-family="Arial" font-size="14" fill="#333333">根容器</text>
  
  <rect x="980" y="150" width="200" height="30" rx="3" fill="#f0f0f0" />
  <text x="1000" y="170" font-family="Arial" font-size="14" fill="#333333">矩形 #1</text>
  
  <rect x="980" y="190" width="200" height="30" rx="3" fill="#f0f0f0" />
  <text x="1000" y="210" font-family="Arial" font-size="14" fill="#333333">圆形 #1</text>
  
  <rect x="980" y="230" width="200" height="30" rx="3" fill="#f0f0f0" />
  <text x="1000" y="250" font-family="Arial" font-size="14" fill="#333333">文本 #1</text>
  
  <!-- 主编辑区域 -->
  <rect x="240" y="60" width="700" height="740" fill="#ffffff" pattern="url(#grid)" />
  
  <!-- 网格背景 -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- 编辑区域中的示例元素 -->
  <rect x="400" y="200" width="120" height="80" fill="#e6f7ff" stroke="#1890ff" stroke-width="2" />
  <circle cx="600" cy="300" r="50" fill="#fffbe6" stroke="#faad14" stroke-width="2" />
  <text x="450" y="400" font-family="Arial" font-size="24" fill="#333333">示例文本</text>
  
  <!-- 选中元素的控制点 -->
  <rect x="398" y="198" width="124" height="84" fill="none" stroke="#1890ff" stroke-width="1" stroke-dasharray="5,5" />
  <rect x="392" y="192" width="8" height="8" fill="#ffffff" stroke="#1890ff" />
  <rect x="520" y="192" width="8" height="8" fill="#ffffff" stroke="#1890ff" />
  <rect x="392" y="280" width="8" height="8" fill="#ffffff" stroke="#1890ff" />
  <rect x="520" y="280" width="8" height="8" fill="#ffffff" stroke="#1890ff" />
  
  <!-- 底部状态栏 -->
  <rect x="0" y="780" width="1200" height="20" fill="#f0f0f0" />
  <text x="10" y="795" font-family="Arial" font-size="12" fill="#666666">坐标: x=400, y=200 | 尺寸: 宽=120, 高=80</text>
</svg>